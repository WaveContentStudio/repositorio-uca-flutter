name: repositorio_uca
description: Repositorio UCA - app para compartir apuntes entre estudiantes de la UCA (Flutter + Firebase).
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.2
  firebase_auth: 6.7.1
  cloud_firestore: 6.10.2
  file_picker: 10.3.10
  url_launcher: 6.3.3
  google_fonts: 6.3.3
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_lints: any

flutter:
  uses-material-design: true
