# Arma el APK de Android y lo publica en "Releases" para descargarlo.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - run: flutter pub get

      - name: Armar APK
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk RepositorioUCA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RepositorioUCA-apk
          path: RepositorioUCA.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Repositorio UCA (build ${{ github.run_number }})
          body: |
            APK para Android (6.0 o más nuevo).
            Descargá **RepositorioUCA.apk**, abrilo en el celular y aceptá instalar apps de origen desconocido.
          files: RepositorioUCA.apk
          make_latest: true
